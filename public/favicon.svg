<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Yellow Background with Rounded Corners and Bold Border -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#facc15" stroke="#09090b" stroke-width="4"/>
  
  <!-- Red Rising Sun in the Center -->
  <circle cx="32" cy="24" r="10" fill="#dc2626" stroke="#09090b" stroke-width="3"/>
  
  <!-- Simplified Railing Structure -->
  <!-- Top Rail -->
  <line x1="8" y1="40" x2="56" y2="40" stroke="#09090b" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom Rail -->
  <line x1="8" y1="52" x2="56" y2="52" stroke="#09090b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Pillars -->
  <line x1="18" y1="36" x2="18" y2="56" stroke="#09090b" stroke-width="5" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="32" y2="56" stroke="#09090b" stroke-width="5" stroke-linecap="round"/>
  <line x1="46" y1="36" x2="46" y2="56" stroke="#09090b" stroke-width="5" stroke-linecap="round"/>
</svg>
